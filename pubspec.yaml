name: clickout_cashier
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # 👇 Doctor
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.8

  # 👇 Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.17.5
